
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notificações | Conecta+</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="pagina-notificacoes">

        <header class="topo-notificacoes">

            <a href="index.html" class="logo-notificacoes">
                CONECTA<span>+</span>
            </a>

            <a href="perfil.html" class="voltar-notificacoes">
                Meu perfil
            </a>

        </header>

        <section class="cabecalho-notificacoes">

            <span>FIQUE POR DENTRO</span>

            <h1>Notificações</h1>

            <p>
                Acompanhe seus avisos, lembretes e novidades
                do Conecta+ em um só lugar.
            </p>

        </section>

        <section class="conteudo-notificacoes">

            <div class="titulo-notificacoes">

                <div>
                    <h2>Seus avisos</h2>
                    <p id="resumo-notificacoes">
                        Carregando suas notificações...
                    </p>
                </div>

                <button id="marcar-todas" type="button">
                    Marcar todas como lidas
                </button>

            </div>

            <div class="lista-notificacoes" id="lista-notificacoes"></div>

            <div class="sem-notificacoes" id="sem-notificacoes"
                style="display: none;">

                <span>🔔</span>
                <h3>Tudo em dia!</h3>
                <p>Você não possui notificações no momento.</p>

            </div>

        </section>

        <footer class="rodape-notificacoes">
            <p>Conecta+ · Esporte e conhecimento caminhando juntos!</p>
        </footer>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src="supabase.js"></script>
    <script src="notificacoes.js"></script>

</body>
</html>
