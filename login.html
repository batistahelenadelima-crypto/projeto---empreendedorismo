
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Conecta+</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="pagina-login">

        <a href="index.html" class="logo-login">
            CONECTA<span>+</span>
        </a>

        <div class="caixa-login">

            <div class="titulo-secao">
                <span>BEM-VINDO DE VOLTA</span>

                <h2>Que bom ter você aqui!</h2>

                <p>
                    Entre na sua conta para acompanhar
                    suas atividades e conquistas.
                </p>
            </div>

            <form class="form-login">

                <label for="email">E-mail</label>
                <input
                    type="email"
                    id="email"
                    placeholder="Digite seu e-mail"
                    required
                >

                <label for="senha">Senha</label>
                <input
                    type="password"
                    id="senha"
                    placeholder="Digite sua senha"
                    required
                >

                <button type="submit">Entrar →</button>

            </form>

            <p class="texto-cadastro">
                Ainda não tem uma conta?
                <a href="inscricao.html">Faça sua inscrição</a>
            </p>

        </div>

        <a href="acesso.html" class="voltar">
            ← Voltar
        </a>

    </main>

</body>
</html>
