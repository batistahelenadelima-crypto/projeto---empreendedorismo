
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Conecta+</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="pagina-login">

        <a href="index.html" class="logo-login">
            CONECTA<span>+</span>
        </a>

        <div class="caixa-login">

            <div class="cabecalho-login">
                <span>ÁREA DO ESTUDANTE</span>

                <h2>Bem-vindo de volta!</h2>

                <p>
                    Acesse sua conta e continue acompanhando
                    sua jornada no Conecta+.
                </p>
            </div>

            <form class="form-login">

                <div class="campo-login">
                    <label for="email">E-mail</label>

                    <input
                        type="email"
                        id="email"
                        placeholder="seunome@email.com"
                        required
                    >
                </div>

                <div class="campo-login">
                    <label for="senha">Senha</label>

                    <input
                        type="password"
                        id="senha"
                        placeholder="Digite sua senha"
                        required
                    >
                </div>

                <button type="submit">
                    Entrar na plataforma →
                </button>

            </form>

            <div class="divisor-login">
                <span>OU</span>
            </div>

            <p class="texto-cadastro">
                Ainda não faz parte do Conecta+?
                <a href="inscricao.html">Criar minha conta</a>
            </p>

        </div>

        <a href="acesso.html" class="voltar">
            ← Voltar às opções de acesso
        </a>

    </main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
    <script src="supabase.js"></script>
</body>
</html>
